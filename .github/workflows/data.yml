name: Update kicker data

on:
  schedule:
    # 3am Pacific (10:00 UTC, 11:00 UTC in winter is fine either way), September through February
    - cron: "0 10 * 9-12,1-2 *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to rebuild (space separated, blank = current)"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data (and load it into Supabase when the secret is set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            pip install -q "psycopg[binary]"
            python3 scripts/build_data.py --push ${{ github.event.inputs.seasons }}
          else
            python3 scripts/build_data.py ${{ github.event.inputs.seasons }}
          fi
      - name: Commit if changed
        run: |
          git config user.name "kicker-league-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"; git reset -q
          else
            git commit -m "Update kicker data" && git push
          fi
